services:
  # 1. База данных PostgreSQL (для EF Core и расписания Hangfire)
  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: messenger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Брокер сообщений RabbitMQ с веб-панелью управления (для MassTransit)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: messenger_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Порт для подключения из C# кода (AMQP)
      - "15672:15672" # Веб-интерфейс в браузере: http://localhost:15672

  # 3. Тестовый SMTP-сервер Mailpit (для перехвата и просмотра Email)
  mailpit:
    image: axllent/mailpit:latest
    container_name: messenger_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP-порт, куда C# приложение будет слать письма
      - "8025:8025" # Веб-почта в браузере: http://localhost:8025

volumes:
  postgres_data: